name:  Python Package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]


jobs:
  deploy:
    runs-on: ubuntu-latest # nosemgrep : semgrep.dev/s/swati31196:github_provided_runner
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3, 3.5, 3.6, 3.7, 3.8, 3.9, 3.10]

    steps:
    - uses: actions/checkout@v2
    - name: Start PMG proxy
      uses: safedep/pmg@v1
      with:
        server-mode: true
        api-key: ${{ secrets.SAFEDEP_API_KEY }}
        tenant-id: ${{ secrets.SAFEDEP_TENANT_ID }}
    - name: Set up Python
      uses: actions/setup-python@v2
    - name: Install dependencies
      run: |
        pip install setuptools
        python -m pip install --upgrade pip
        pip install responses
        python3 setup.py install
    - name: Run Tests
      run: python3 -m unittest
    - name: Stop PMG proxy
      if: always()
      run: pmg proxy stop --fail-on-violation
